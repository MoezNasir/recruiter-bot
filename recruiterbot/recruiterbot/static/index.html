<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Moez — AI/ML engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="header">
    <div class="mark" aria-hidden="true">M</div>
    <div class="header-text">
      <h1>Moez</h1>
      <p>AI/ML engineer — ask me anything a recruiter would</p>
    </div>
    <div class="status" title="This assistant is live">
      <span class="status-dot"></span>
      <span class="status-label">online</span>
    </div>
  </header>

  <main class="transcript" id="transcript" aria-live="polite">
    <div class="intro">
      <p>Questions about my background, skills, and projects get a real answer.
      A few things — like compensation or personal details — I'll point you to
      direct contact instead.</p>
    </div>
  </main>

  <form class="composer" id="composer">
    <textarea
      id="question-input"
      placeholder="Ask me anything…"
      rows="1"
      maxlength="500"
      aria-label="Your question"
    ></textarea>
    <button type="submit" id="send-button" aria-label="Send question">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 8H14M14 8L9 3M14 8L9 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

</div>

<script src="script.js"></script>
</body>
</html>
